[project]
name = "rag-agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "flask>=3.1.3",
    "google-genai>=2.11.0",
    "gradio>=6,<7",
    "langchain>=1.3.12",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "langchain-google-genai>=4.2.7",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.6",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.9",
    "llama-index-core>=0.14.23",
    "llama-index-embeddings-google-genai>=0.5.1",
    "llama-index-llms-google-genai>=0.9.6",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "scipy>=1.18.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.pyright]
extraPaths = [
  "01-prompt-engineering-langchain-templates",
  "02-langchain-core-rag-agents",
  "03-multi-provider-genai-flask",
  "04-rag-private-documents",
  "05-gradio-llm",
  "06-pdf-rag-gradio-app",
  "07-llamaindex-icebreaker-bot",
  "08-similarity-search-by-hand",
]
